name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Check starter syntax
        run: bash -n scripts/start.sh scripts/start-open-model.sh scripts/startup-common.sh scripts/Assistant.command scripts/install-mac-app.sh scripts/test-mac-host.sh
      - name: Test guided setup and open-model recovery
        run: python3 -m unittest discover -s Tests/ScriptTests -p 'test_*.py'
      - name: Test
        run: swift test
      - name: Install and probe sandboxed model worker
        if: ${{ !cancelled() && matrix.runner == 'macos-26' }}
        run: |
          ./scripts/setup-local-model.sh
          ./scripts/check-model-worker.sh
      - name: Test native host lifecycle
        if: ${{ !cancelled() && matrix.runner == 'macos-26' }}
        run: bash scripts/test-mac-host.sh
      - name: Build and verify native Mac app
        if: ${{ !cancelled() && matrix.runner == 'macos-26' }}
        run: |
          brew install steipete/tap/imsg
          bash scripts/install-mac-app.sh --build-only --output "$RUNNER_TEMP/LocalAssistant.app"
          "$RUNNER_TEMP/LocalAssistant.app/Contents/MacOS/LocalAssistant" --check-payload
  phone:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build iPhone app for Simulator
        run: >-
          xcodebuild -project Apps/AssistantPhone/AssistantPhone.xcodeproj
          -scheme AssistantPhone -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Build iPhone app for device
        run: >-
          xcodebuild -project Apps/AssistantPhone/AssistantPhone.xcodeproj
          -scheme AssistantPhone -destination 'generic/platform=iOS'
          -derivedDataPath DerivedDataDevice CODE_SIGNING_ALLOWED=NO build
      - name: Run phone companion smoke test
        run: >-
          xcodebuild -project Apps/AssistantPhone/AssistantPhone.xcodeproj
          -scheme AssistantPhone -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest,arch=arm64'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES test
